[tools]
rust = "latest"

[tasks.build]
description = "Build the pact binary (with the ui feature)"
run = "cargo build --features ui"

[tasks.test]
description = "Run the pact test suite (with the ui feature)"
run = "cargo test --features ui"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks."fmt-check"]
description = "Check formatting without writing changes"
run = "cargo fmt -- --check"

[tasks.lint]
description = "Run clippy with warnings denied, both feature-on and default"
# Both, deliberately. Every other task builds with --features ui, and that let a
# ui-only helper ship as dead code in the default build: `mise run check` was
# green, CI's default-build job was red, and master was pushed broken. A local
# gate that does not match CI is not a gate.
run = [
  "cargo clippy --all-targets --features ui,otel -- -D warnings",
  "cargo clippy --all-targets -- -D warnings",
]

[tasks."check-docs"]
description = "Fail if README/docs drift from the real CLI: missing commands or flags, dead relative links, undocumented doctor checks (pact-qbo)"
run = "./scripts/check-docs.sh"

[tasks.otel]
description = "Clippy + test the opt-in `otel` feature, and prove it still costs zero dependencies (pact-aw7)"
# The `ui` feature rotted unbuilt until CI grew a job for it; `otel` is off by
# default for the same reason and would rot the same way. The tree comparison is
# the load-bearing line: the whole reason the exporter is hand-rolled OTLP over
# std::net is that every `opentelemetry-otlp` combination drags in tonic and
# tokio, so "adds nothing" is a promise that has to be enforced, not remembered.
#
# `--edges normal,build,dev` and not `--edges normal`: the plain form prints
# neither [build-dependencies] nor [dev-dependencies], so a build-dep or dev-dep
# added by the feature passed this guard silently. pact already HAS a
# build-dependency (chrono, via build.rs), and a codegen build-dep is the most
# likely next thing a hand-rolled JSON encoder reaches for.
run = [
  "cargo clippy --all-targets --features ui,otel -- -D warnings",
  "cargo test --features ui,otel",
  # `mcp` is the second off-by-default feature and makes the same promise. Its
  # own leg because the *default* build is where `pact mcp serve` must not
  # exist, and tests/mcp_absent.rs asserts exactly that.
  "cargo clippy --all-targets --features mcp,otel -- -D warnings",
  "cargo test --features mcp,otel",
  """
  base="$(cargo tree --edges normal,build,dev)"
  for f in otel mcp mcp,otel; do
    test "$base" = "$(cargo tree --edges normal,build,dev --features "$f")" \
      || { echo "the $f feature(s) changed the dependency tree:"; \
           cargo tree --edges normal,build,dev --features "$f"; exit 1; }
  done
  """,
]

[tasks.check]
description = "Run the full CI check locally: fmt, lint (both feature sets), test, otel, docs."
depends = ["fmt-check", "lint", "test", "otel", "check-docs"]

[tasks.install]
description = "Build and install the pact binary locally, ui feature included"
run = "cargo install --path . --force --features ui"
