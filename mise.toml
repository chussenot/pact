[tools]
rust = "latest"

[env]
# Every feature this repo can build, in one place so the tasks cannot disagree
# about what "all of them" means. Local development builds with all of it: what
# you run is then what you tested, and an off-by-default feature that nothing
# compiles rots — `ui` proved that by breaking while every task was green.
#
# Adding a feature to Cargo.toml means adding it here, and to the two-way legs in
# `lint`, `test` and `otel` that keep the *default* build honest.
PACT_ALL_FEATURES = "ui,otel,mcp"

[tasks.build]
description = "Build the pact binary with every feature enabled"
run = "cargo build --features $PACT_ALL_FEATURES"

[tasks.test]
description = "Run the test suite with every feature, then again with none"
# Both, and the second is not redundant. Some tests exist ONLY in the default
# build: `tests/mcp_absent.rs` is gated `not(feature = "mcp")` and asserts that
# `pact mcp serve` does not exist without its feature — an all-features run
# skips it silently, which is the one build where that assertion means anything.
# The same shape of gap once shipped a ui-only helper as dead code in the default
# build: local green, CI red, master broken.
#
# Default FIRST, all-features SECOND, and the order is load-bearing: both write
# the same `target/debug/pact`, so whichever runs last is the binary left on
# disk. With the default leg last, `mise run test` followed by
# `./target/debug/pact ui` answers "unrecognized subcommand" — the stale-binary
# confusion this repo has already been bitten by once.
#
# The THIRD leg runs with no Beads CLI reachable, which is the configuration CI
# actually has — and the one a developer machine structurally cannot reproduce,
# because a developer has bd installed. That gap let
# `a_worktree_of_a_bare_repo_anchors_state_and_refuses_messaging` pass locally and
# fail on every CI push for four days: exit 3 has two causes ("no backend" and
# "bare topology cannot message"), the test asserted the topology one, and without
# a backend the other wins. Four red pushes were reported as green from local runs.
#
# It is also a supported configuration in its own right, not just a CI mimic:
# `init`, `lease`, `log` and most of `doctor` work with no Beads CLI at all, and
# exit 3 is documented for the parts that do not.
run = [
  "cargo test",
  "cargo test --features $PACT_ALL_FEATURES",
  """
  # Exclude exactly the directory bd lives in, rather than pattern-matching
  # the PATH: on a machine without them this is a no-op, which is correct.
  p="$PATH"
  for b in bd; do
    d="$(command -v "$b" 2>/dev/null)" || continue
    p="$(printf '%s' "$p" | tr ':' '\n' | grep -vxF "$(dirname "$d")" | paste -sd: -)"
  done
  echo "no-backend leg: bd=$(PATH="$p" command -v bd || echo absent)"
  PATH="$p" cargo test --features $PACT_ALL_FEATURES
  """,
]

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks."fmt-check"]
description = "Check formatting without writing changes"
run = "cargo fmt -- --check"

[tasks.lint]
description = "Run clippy with warnings denied, both feature-on and default"
# Both, deliberately. Every other task builds with the features on, and that let
# a ui-only helper ship as dead code in the default build: `mise run check` was
# green, CI's default-build job was red, and master was pushed broken. A local
# gate that does not match CI is not a gate.
run = [
  "cargo clippy --all-targets --features $PACT_ALL_FEATURES -- -D warnings",
  "cargo clippy --all-targets -- -D warnings",
]

[tasks."check-docs"]
description = "Fail if README/docs drift from the real CLI: missing commands or flags, dead relative links, undocumented doctor checks (pact-qbo)"
run = "./scripts/check-docs.sh"

[tasks.otel]
description = "Clippy + test the opt-in `otel` feature, and prove it still costs zero dependencies (pact-aw7)"
# The `ui` feature rotted unbuilt until CI grew a job for it; `otel` is off by
# default for the same reason and would rot the same way. The tree comparison is
# the load-bearing line: the whole reason the exporter is hand-rolled OTLP over
# std::net is that every `opentelemetry-otlp` combination drags in tonic and
# tokio, so "adds nothing" is a promise that has to be enforced, not remembered.
#
# `--edges normal,build,dev` and not `--edges normal`: the plain form prints
# neither [build-dependencies] nor [dev-dependencies], so a build-dep or dev-dep
# added by the feature passed this guard silently. pact already HAS a
# build-dependency (chrono, via build.rs), and a codegen build-dep is the most
# likely next thing a hand-rolled JSON encoder reaches for.
#
# Deliberately NOT $PACT_ALL_FEATURES — do not "simplify" these into one leg.
# These are PAIRS, and the pairs are the point: a `#[cfg(feature = "mcp")]` item
# that only compiles when `ui` is also on is invisible to an all-features build
# and breaks for the user who asked for `mcp` alone. `mise run build` wants every
# feature; this task wants the combinations, which is the opposite job.
run = [
  "cargo clippy --all-targets --features ui,otel -- -D warnings",
  "cargo test --features ui,otel",
  # `mcp` is the second off-by-default feature and makes the same promise. Its
  # own leg because the *default* build is where `pact mcp serve` must not
  # exist, and tests/mcp_absent.rs asserts exactly that.
  "cargo clippy --all-targets --features mcp,otel -- -D warnings",
  "cargo test --features mcp,otel",
  """
  base="$(cargo tree --edges normal,build,dev)"
  for f in otel mcp mcp,otel; do
    test "$base" = "$(cargo tree --edges normal,build,dev --features "$f")" \
      || { echo "the $f feature(s) changed the dependency tree:"; \
           cargo tree --edges normal,build,dev --features "$f"; exit 1; }
  done
  """,
]

[tasks.fleet]
description = "Soak-test pact at fleet concurrency with scripted workers (see docs/testing.md)"
# Deliberately NOT in `check`. It is minutes long, it is probabilistic, and it
# needs a Beads CLI — three properties that turn a required gate into one people
# disable. `mise run fleet` when you have changed lease or message internals; CI
# runs it weekly.
#
# The pair is what makes it a measurement rather than a demo: the control run has
# leases removed and MUST lose updates, and the treatment run MUST lose none. A
# green treatment on its own only means the workload never contended.
run = [
  "scripts/fleet-sim.sh -n 8 -t 20 --no-leases > /tmp/pact-fleet-control.txt",
  "scripts/fleet-verify.sh \"$(tail -1 /tmp/pact-fleet-control.txt)\"",
  "scripts/fleet-sim.sh -n 8 -t 20 > /tmp/pact-fleet-treatment.txt",
  "scripts/fleet-verify.sh \"$(tail -1 /tmp/pact-fleet-treatment.txt)\"",
]

[tasks.lint-scripts]
description = "shellcheck every script in scripts/, at warning severity."
# `--severity=warning`, not the default, and the reason is that the default
# includes `info` — which today means SC2013 on a deliberate word-split and
# SC2018/SC2019 on an ASCII-only `tr 'A-Z' 'a-z'` in check-docs.sh. Both are
# correct as written, so a gate at default severity would be red on arrival and
# get switched off. At `warning` it is green today and still catches the things
# that are actually bugs: unquoted expansions, unreachable code, misused tests.
#
# This exists because scripts/chaos.sh is destructive, and "shellcheck-clean"
# had to be a property something enforces rather than a sentence in its header.
run = "shellcheck --severity=warning scripts/*.sh"

[tasks.check]
description = "Run the full CI check locally: fmt, lint, test, otel, docs — serially, as CI does."
# Sequential, and this is not a preference. `depends` runs tasks in PARALLEL, and
# these legs invoke cargo with different feature sets — while every one of them
# reaches the binary through `target/debug/pact`, a single path that the last
# build to finish owns. In parallel, one leg overwrites the artifact another
# leg's integration tests are in the middle of spawning: `mise run check` failed
# three times out of three with tests/mcp_absent.rs seeing a binary that had the
# `mcp` subcommand, because the all-features `test` leg had just replaced it.
#
# CI is serial within a job, so serial here is also what makes local match CI —
# the rule the `lint` task above already exists to enforce.
run = [
  "mise run fmt-check",
  "mise run lint",
  "mise run lint-scripts",
  "mise run test",
  "mise run otel",
  "mise run check-docs",
]

[tasks.install]
description = "Build and install the pact binary locally with every feature enabled"
# All features on purpose: this is the binary that ends up on PATH and gets used
# against this repo, so it should be the one with the most surface to exercise.
# Neither opt-in feature costs anything unasked — `otel` exports only when the
# standard OTEL_* variables are set (+0 ms unconfigured, measured), and `mcp`
# does nothing until a client spawns `pact mcp serve`.
run = "cargo install --path . --force --features $PACT_ALL_FEATURES"
