# Does every version tag have a release?
#
# This exists because the answer was NO for five days and nothing said so.
#
# Tags 0.13.0, 0.14.0, 0.15.0 and 0.15.1 were pushed to origin and `release.yml`
# never ran for any of them. `git tag` moved, CI moved, `gh release list` stayed
# pinned at 0.12.0, and the install path stayed pinned with it — a downstream
# project proving out 0.15 was running a 0.12.0 binary and had no way to tell.
# Every individual signal was green. The only thing that would have caught it is
# diffing two lists nobody diffs, which is what this job does.
#
# ## The cause, and why a retry would not have helped
#
# **GitHub does not create tag push events when more than three tags arrive in
# one push.** Not an error, not a skipped run — no event at all, so there is
# nothing in the Actions tab to notice the absence of.
#
# The evidence is clean, because this repository ran the experiment by accident:
#
# | pushed together | runs fired |
# |---|---|
# | 0.11.1, 0.12.0 | 2 |
# | 0.13.0, 0.14.0, 0.15.0, 0.15.1 | 0 |
#
# Master was pushed each time a version landed — CI fired on all four — and the
# tags accumulated locally and went up in one `git push --tags` afterwards.
#
# **So: push version tags ONE AT A TIME.** `git push origin <tag>`, per tag. This
# job is the backstop for when somebody forgets, which is the right shape for a
# rule no tooling here enforces.
#
# ## It also checks which release GitHub calls "Latest"
#
# Because the remedy for the first check broke it. 0.13.0 was re-pushed on its
# own as advised, released the day AFTER 0.16.0, and GitHub — which picks the
# newest-published release, not the highest version, when nobody says otherwise —
# made 0.13.0 "Latest". `mise use github:chussenot/pact@latest` then installed
# 0.13.0 for seven weeks. Both lists agreed on every tag that mattered; the badge
# was the only thing wrong, and nothing compared it to anything.
#
# `release.yml` now passes `--latest` explicitly, but a re-pushed tag runs the
# workflow AS IT WAS AT THAT TAG, so recovering an old tag still runs the old
# pipeline. Hence the remedy below ends with putting the badge back.
#
# ## Why it only reports
#
# It opens no release. Republishing a tag is a decision with a blast radius —
# `release.yml`'s own `workflow_dispatch` publishes nothing for the same reason —
# and the failure mode this catches is "nobody looked", which a red scheduled job
# fixes. The remedy is one command, and the job prints it.
name: Release drift

on:
  schedule:
    # After the nightly bench, so a failure here is not competing for attention
    # with a run that takes minutes.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tags-without-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are the entire subject of this job, and a shallow clone has none.
          fetch-depth: 0

      - name: Every version tag must have a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The same shape release.yml triggers on, so this cannot drift into
          # asking about tags that were never meant to release.
          tags="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V)"
          releases="$(gh release list --limit 200 --json tagName -q '.[].tagName' | sort -V)"

          # The floor: the OLDEST tag that has a release. Everything before it
          # predates this repository having a release pipeline at all — 0.1.0
          # through 0.7.5 were never published and never will be — and a job that
          # is red about history is a job nobody reads.
          floor="$(head -1 <<<"$releases")"
          echo "checking tags from $floor onward"

          missing=""
          for tag in $tags; do
            # Older than the floor: not drift, just history.
            if [ "$tag" != "$floor" ] \
               && [ "$(printf '%s\n%s\n' "$tag" "$floor" | sort -V | head -1)" = "$tag" ]; then
              continue
            fi
            # On master only. A tag on an abandoned branch is not a missed
            # release, and release.yml's integrity job would have refused it.
            if ! git merge-base --is-ancestor "$tag" origin/master 2>/dev/null; then
              continue
            fi
            if ! grep -qxF "$tag" <<<"$releases"; then
              missing="$missing $tag"
            fi
          done

          # The highest PUBLISHED version: what "Latest" must be, and so what
          # `@latest` installs.
          highest="$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$releases" | tail -n1)"
          failed=0

          if [ -n "$missing" ]; then
            failed=1
            echo "::error::tags on master with no GitHub release:$missing"
            echo
            echo "Most likely cause: more than three tags were pushed in one push, so"
            echo "GitHub created no tag push events and release.yml never ran. Push"
            echo "version tags one at a time."
            echo
            echo "To release a missed tag, re-push it on its own:"
            for tag in $missing; do
              echo "  git push origin :refs/tags/$tag && git push origin $tag"
            done
            echo
            echo "Each re-push runs release.yml as it was AT THAT TAG, which may not"
            echo "set --latest. When they have all finished, put the badge back:"
            # The badge's target once the re-pushes land, which is a missing tag
            # itself when the newest tag is the one that never released.
            target="$(printf '%s\n' "$highest" $missing | sort -V | tail -n1)"
            echo "  gh release edit $target --latest"
            echo
          else
            echo "every version tag on master has a release"
          fi

          # Compared against releases, not tags: a tag still waiting on its
          # release is the check above's problem, not this one's.
          latest="$(gh release view --json tagName -q .tagName)"
          if [ "$latest" != "$highest" ]; then
            failed=1
            echo "::error::GitHub's Latest release is $latest, but the highest published version is $highest"
            echo
            echo "Anything installing @latest is getting $latest. Most likely cause: an"
            echo "older tag was released after $highest and GitHub gave it the badge."
            echo
            echo "To fix:"
            echo "  gh release edit $highest --latest"
          else
            echo "Latest is $latest, the highest published version"
          fi

          exit "$failed"
