name: Release

# Two things happen here, in this order and only in this order: a tag is checked,
# then binaries are built and published from it. The `needs:` chain is what makes
# that an order rather than a hope.
#
# ## Why this is hand-written and not cargo-dist
#
# cargo-dist generates roughly a thousand lines of YAML that this repository
# would then own without having written — and would have to reason about the next
# time a target, a feature profile or a permission needs to change. That trade is
# wrong here specifically: pact's whole convention is explicit machinery with the
# reasoning attached (see `src/otel.rs` on why the OTLP exporter is hand-rolled,
# and the `mcp` feature comment on why JSON-RPC is). A release pipeline is a
# supply chain, and the one thing it must not be is opaque to its own
# maintainer. What is below fits on two screens and every unusual line says why
# it is there.
#
# ## Dry runs
#
# `workflow_dispatch` with a `tag` input (default: the newest tag) builds and
# packages every matrix leg and publishes NOTHING. That exists because the
# alternative way to test a release pipeline is to cut a tag, and a tag is not a
# thing you get to take back — the `integrity` job below exists because of a tag
# that had to be deleted and recreated. The publish job is skipped in that mode
# by the needs-chain rather than by a condition of its own; see its comment.
#
# ## A tag is the one ref people trust without checking. This job checks it.
#
# 0.3.1 was first created on a commit chain that never became an ancestor of
# master: the branch was rebuilt with new SHAs and the tag stayed behind on the
# pre-rebase chain, unreachable from any branch. Nothing was lost that time —
# the trees happened to be identical — but nothing said so, and the only way to
# find out was to notice by hand that `git merge-base --is-ancestor` failed.
#
# Runs on the tag push, so a bad tag is red within a minute of being created
# rather than at release time.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run — builds every leg, publishes nothing). Defaults to the newest tag."
        required: false
        type: string

# Read-only by default. `publish` widens this for itself and nothing else widens
# it at all: a build job that cannot write to the repository cannot leak a
# release even if a step in it is wrong.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Push-only, because every check below compares against `github.ref_name`,
    # which is a tag on a tag push and a BRANCH on a manual dispatch — the
    # version comparison would fail on a dry run for a reason that has nothing to
    # do with release integrity. Nothing inside the job changed; this decides
    # when it runs, not what it checks.
    #
    # Skipping it is also what makes a dry run unable to publish, since `publish`
    # needs it and a skipped dependency skips its dependents.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check needs real history and the master ref, neither of
          # which a shallow single-branch checkout provides.
          fetch-depth: 0

      - name: Tag commit is an ancestor of master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "$TAG ($GITHUB_SHA) is on master"
            exit 0
          fi
          cat >&2 <<EOF
          ::error::Tag $TAG points at $GITHUB_SHA, which is NOT an ancestor of origin/master.

          This is the orphaned-tag failure mode. It happens when a branch is
          rebased or amended after a tag was cut: the tag keeps pointing at the
          pre-rebase commit, which is then reachable from no branch at all. The
          tag still resolves, \`git show\` still works, and a release built from
          it can quietly differ from what master says shipped — or be garbage
          collected.

          To fix, once you have confirmed the content really is on master
          (\`git diff $TAG origin/master\` should be empty):

              git tag -d $TAG
              git push origin :refs/tags/$TAG
              git tag -a $TAG <the-commit-on-master> -m "..."
              git push origin $TAG

          If the diff is NOT empty, the tag has commits master never got. Merge
          or cherry-pick them first, then re-tag.
          EOF
          exit 1

      - name: Cargo.toml version equals the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # First [package] version only: dependency versions also match
          # `^version` inside their own tables, so anchor on the file's first hit.
          out="$(grep -m1 -E '^version = "' Cargo.toml)"
          CARGO_VERSION="${out#version = \"}"
          CARGO_VERSION="${CARGO_VERSION%\"}"
          if [ "$CARGO_VERSION" != "$TAG" ]; then
            echo "::error::Cargo.toml says $CARGO_VERSION but the tag is $TAG. A tag that disagrees with the manifest ships a binary whose --version lies."
            exit 1
          fi
          echo "Cargo.toml: $CARGO_VERSION"

      - name: Cargo.lock agrees
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # pact's OWN entry in the lockfile, not a dependency that happens to
          # share the version. awk finds `name = "pact"` and reads the version
          # from the same [[package]] block.
          LOCK_VERSION="$(awk '
            /^name = "pact"$/ { found = 1; next }
            found && /^version = / { gsub(/^version = "|"$/, ""); print; exit }
          ' Cargo.lock)"
          if [ -z "$LOCK_VERSION" ]; then
            echo "::error::no [[package]] named pact in Cargo.lock — has the crate been renamed?"
            exit 1
          fi
          if [ "$LOCK_VERSION" != "$TAG" ]; then
            echo "::error::Cargo.lock has pact at $LOCK_VERSION but the tag is $TAG. The lockfile was not regenerated after the version bump, so a --locked build resolves the wrong version."
            exit 1
          fi
          echo "Cargo.lock: $LOCK_VERSION"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip — pins the ACTION, not the toolchain; Rust stays current because the action installs whatever stable is at run time

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Release build smoke check
        run: cargo build --release

  # Resolve the tag once, so nothing downstream has to know which event started
  # the run. On a tag push that is `github.ref_name`; on a dispatch it is the
  # input, or the newest tag when the input was left blank.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git tag` needs the tags, which a shallow checkout does not fetch.
          fetch-depth: 0

      - name: Pick the tag
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # Newest by version, not by date: tags are cut in version order but
            # a re-created tag (see `integrity`) has a newer timestamp and an
            # older version.
            TAG="$(git tag --sort=-v:refname | head -n1)"
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::no such tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "building $TAG"

  build:
    needs: [integrity, resolve]
    # `integrity` is skipped on a dry run and MUST have succeeded otherwise. The
    # default `needs` semantics would skip this job along with it, so the result
    # is named explicitly — but only `success` and `skipped` are accepted, so an
    # integrity FAILURE still stops everything here. That distinction is the
    # whole point: a dry run may build, a broken tag may not.
    if: ${{ !cancelled() && (needs.integrity.result == 'success' || needs.integrity.result == 'skipped') && needs.resolve.result == 'success' }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      # One broken target must not hide the state of the other seven: "musl
      # failed but darwin was fine" is a diagnosis, and fail-fast erases it.
      fail-fast: false
      matrix:
        # Native runners only, no cross-rs: GitHub has ARM runners now, so
        # cross-compilation would add a tool to trust for no coverage — and it
        # would cost the sanity run below, which only works because every leg can
        # execute the binary it just produced.
        #
        # No Windows, and the absence is a decision rather than an omission:
        # pact's coordination model assumes unix semantics throughout. Lease
        # claims rely on `rename`/`hard_link` atomicity guarantees POSIX makes
        # and Windows does not, `src/otel.rs` reads `/dev/urandom` for span ids,
        # and the instruction files `pact init` writes reference sh-based hooks.
        # A Windows binary would compile and then be wrong in ways no test here
        # would catch.
        target:
          # musl means static: one binary that runs on any distro regardless of
          # glibc version, and inside `FROM scratch` images. This is the artifact
          # a CI fleet actually pulls, which is why it leads the list.
          - triple: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - triple: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          # Apple Silicon only. `x86_64-apple-darwin` was here on `macos-13`
          # and is REMOVED rather than moved, because it is what stopped this
          # workflow ever publishing: GitHub retired the macos-13 image, both
          # Intel legs then sat "awaiting a runner" until the 24-hour ceiling
          # killed them, and `publish` needs every leg — so all six healthy
          # builds (each under 70 seconds) were thrown away on every tag from
          # 0.5.0 to 0.7.5. Nine cancelled runs, zero releases.
          #
          # Not restored by cross-compiling on the arm runner: that would give
          # up the sanity run below, which only works because every leg can
          # execute the binary it just produced, and an untested Intel binary
          # is worse than an absent one. Intel Mac users build from source
          # (`cargo install --path .`) until a native runner exists again.
          - triple: aarch64-apple-darwin
            os: macos-latest
        # ONE profile, and the reason is asset resolution rather than build
        # cost. A tool manager picks a release asset by matching the OS and
        # architecture in its name, so two tarballs per platform — `-lean` and
        # `-full` — are two candidates it has to break a tie between. Which one
        # it picks is an implementation detail of the manager, and getting it
        # wrong hands `mise use -g github:chussenot/pact@latest` a binary with
        # no `pact ui` and no `pact mcp serve` on a workstation. One asset per
        # platform makes the question disappear instead of betting on it.
        #
        # `full` is the survivor because that is what install.md already calls
        # the right default for a workstation: `otel` exports nothing until the
        # standard `OTEL_*` variables are set and `mcp` does nothing until a
        # client spawns `pact mcp serve`, so the features are inert until asked
        # for and cost 0.5 MiB. `lean` remains buildable —
        # `cargo install --path . --no-default-features` — and install.md says
        # so; it is no longer a download.
        #
        # `--features` is pinned explicitly rather than relying on defaults: the
        # artifact NAME is a promise about the contents, and a default feature
        # added to Cargo.toml later must not silently rewrite it.
        profile:
          - name: full
            flags: --features ui,otel,mcp
        # No exclusions. Every target was built before this workflow was
        # written, including `ui` on musl — ratatui and crossterm are pure Rust
        # here, so musl needs no C toolchain for them and the resulting binary
        # is `static-pie linked`. If a combination ever does break for a
        # dependency reason, exclude it HERE with the reason, so that a missing
        # artifact is a documented decision rather than a mystery.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip — pins the ACTION, not the toolchain; Rust stays current because the action installs whatever stable is at run time
        with:
          targets: ${{ matrix.target.triple }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Without this every leg shares one cache key and they evict each
          # other, since the same crate is built eight ways.
          key: ${{ matrix.target.triple }}-${{ matrix.profile.name }}

      # Nothing pact depends on needs a C compiler for musl today (verified: a
      # full `ui,otel,mcp` musl build succeeds without it). Installed anyway
      # because the failure it prevents is a linker error deep in a dependency
      # that is nobody's idea of a release-day surprise, and it costs seconds.
      - name: Install musl toolchain
        if: matrix.target.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # --locked, so the artifact matches the lockfile `integrity` just verified
      # against the tag. Resolving dependencies at build time would untie exactly
      # the knot that check ties.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target.triple }} ${{ matrix.profile.flags }}

      # Measured on the full musl profile: 2.85 MiB -> 2.25 MiB, about 22% off,
      # entirely debug symbols nobody can use without the matching source tree.
      # `strip` and not `llvm-strip`: every leg is native, so the host's strip
      # already understands its own object format.
      #
      # Before the verification step, not after, so that what gets asserted is
      # the exact bytes that get packaged. That ordering is load-bearing on
      # aarch64-apple-darwin: the linker gives every arm64 macOS binary an ad-hoc
      # code signature, `strip` invalidates it, and an invalidated signature does
      # not warn — the kernel refuses to exec and the process dies with
      # `Killed: 9`. Verifying the pre-strip binary would have shipped that
      # silently, because the copy that was tested is not the copy in the tarball.
      - name: Strip
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target.triple }}/release/pact"
          before="$(wc -c <"$BIN")"
          strip "$BIN"
          # Re-sign ad hoc on macOS, for the reason above. `-` is the ad-hoc
          # identity, which is what the linker used; this needs no certificate
          # and no notarisation, it only makes the binary executable again.
          case "${{ matrix.target.triple }}" in
          *-apple-darwin) codesign --sign - --force "$BIN" ;;
          esac
          after="$(wc -c <"$BIN")"
          echo "stripped: $before -> $after bytes"

      # The profile promise, asserted in BOTH directions on the runner that just
      # produced the binary — and on the stripped, re-signed binary that will
      # actually be packaged, per the step above. One direction is not enough: "full has the ui
      # subcommand" passing tells you nothing about whether `lean` accidentally
      # has it too, and `lean` quietly shipping ratatui is the exact mistake an
      # artifact name would then be lying about.
      - name: Verify the binary keeps its profile's promise
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target.triple }}/release/pact"

          VERSION="$("$BIN" --version)"
          printf '%s\n' "$VERSION"
          grep -qF "$TAG" <<<"$VERSION" || {
            echo "::error::$BIN does not report $TAG"
            exit 1
          }

          has_ui() { "$BIN" --help | grep -qE '^[[:space:]]+ui[[:space:]]'; }
          # `mcp serve --help` and not `mcp serve`: the real thing would block on
          # stdin waiting for JSON-RPC. --help proves the subcommand is compiled
          # in and exits.
          has_mcp() { "$BIN" mcp serve --help >/dev/null 2>&1; }

          # Unconditional, because there is one profile. The `lean` branch that
          # used to live here is deleted rather than left dead: a dead branch in
          # a release gate is worse than no branch, since the day somebody adds
          # a second profile it will pass whatever shape it happens to have.
          # Restore the if/else together with the matrix entry, not before.
          has_ui  || { echo "::error::full build is missing the ui subcommand"; exit 1; }
          has_mcp || { echo "::error::full build is missing mcp serve"; exit 1; }
          echo "full: ui and mcp serve both present"

      - name: Package
        id: package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # No profile suffix: `pact-<tag>-<triple>` is the shape every tool
          # manager expects (cf. ripgrep, bat), and with one profile there is
          # nothing left to disambiguate.
          NAME="pact-$TAG-${{ matrix.target.triple }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target.triple }}/release/pact" "dist/$NAME/"
          cp README.md CHANGELOG.md "dist/$NAME/"
          # This repository has no LICENSE file yet. Copied when one appears
          # rather than failing the release the day it does.
          [ -f LICENSE ] && cp LICENSE "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          echo "name=$NAME" >>"$GITHUB_OUTPUT"
          ls -la "dist/$NAME.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error

  publish:
    # No `if:` at all, and that is deliberate. This job is gated purely by the
    # needs-chain, which cannot be got wrong by editing a condition: `integrity`
    # failing skips `build`, and either one not succeeding skips this. A dry run
    # skips `integrity`, so it skips this too — the dispatch mode gets its
    # publish-nothing behaviour from the same mechanism that stops a bad tag,
    # rather than from a second rule that could disagree with the first.
    needs: [integrity, build, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Widened here and nowhere else. `contents: write` creates the release;
      # the other two sign the provenance attestation below.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          # Eight uploads, one directory. Without this each arrives in a
          # subdirectory named after its artifact.
          merge-multiple: true

      - name: Checksum every tarball
        run: |
          set -euo pipefail
          cd dist
          # A bare glob, which the shell already expands in sorted order, so the
          # file is byte-identical for the same set of inputs and a human
          # comparing two releases sees only real differences. `--` because a
          # filename could otherwise be read as an option. Basenames only (`-C
          # dist` when packaging, `cd` here), so `sha256sum -c SHA256SUMS` works
          # wherever the files were downloaded to.
          sha256sum -- *.tar.gz >SHA256SUMS
          cat SHA256SUMS
          # Prove the file we just wrote actually verifies, here, rather than
          # letting the first person to try it find out.
          sha256sum -c SHA256SUMS

      - name: Release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/release-notes.sh --self-test
          ./scripts/release-notes.sh "$TAG" >/tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $TAG. cog writes one on bump; a tag without one means the changelog was not committed with the version."
            exit 1
          fi
          cat /tmp/notes.md

      # Cheap SLSA: consumers can run `gh attestation verify` on a tarball and
      # get back which workflow, which commit and which run produced it. It
      # composes with the SHA-pinning story — pinned actions say what ran, an
      # attestation says that it really did.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # `gh release create` rather than a third-party release action: it is
      # already on the runner and already authenticated, so it is one less
      # supply-chain edge for a step that literally publishes the supply chain.
      #
      # Neither a draft nor a prerelease: 0.x IS this project's release series,
      # and a draft that needs a human to press a button is a release that
      # sometimes does not happen.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --verify-tag \
            dist/*.tar.gz dist/SHA256SUMS
