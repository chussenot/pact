name: Canary

# Exercise pact's ONE remaining coupling to bd against a REAL bd release, so
# upstream drift is found by a machine instead of by a user.
#
# This used to protect a message round-trip: pact STORED messages as bd beads, so
# it depended on --include-infra, --parent threading and whether --json hydrated
# labels. Since 0.9.0 messages live in .pact/messages.jsonl and pact issues no bd
# writes at all, so none of those assumptions exist to break.
#
# What remains is that pact READS the committed .beads/interactions.jsonl export
# to reconstruct bead assignees for `pact audit --check claim-lease-divergence`.
# That reader is best-effort and parse-tolerant by contract — a promise about
# somebody else's file format, which is exactly the kind of assumption that rots
# quietly. tests/cli.rs covers it against fixtures pact wrote itself; only this
# job checks it against an export a real bd actually produced.
#
# It also asserts that pact's own surface — msg, watch delivery, lease — works
# with bd removed from PATH entirely, which is the invariant a future subprocess
# would break.
#
# Deliberately NOT part of ci.yml and deliberately not a required check. It
# depends on a third party's release process and on the network, so it must
# never be able to block a PR — a canary that gates merges gets disabled the
# first time upstream has a bad day.

on:
  schedule:
    # Tuesday 06:17 UTC. Off the hour because scheduled runs cluster there and
    # get queued; a weekday so a failure lands when somebody is around to read
    # the issue it opens.
    - cron: "17 6 * * 2"
  workflow_dispatch:

# A weekly job that overlaps itself is a job someone forgot to cancel. Manual
# runs supersede a scheduled one already in flight.
concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  # The report job asks the API which legs failed. An explicit permissions block
  # denies everything not listed, so without this that call 403s and the issue
  # says "unknown".
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Both legs always run: "latest passed but pinned failed" is itself a
      # diagnosis, and fail-fast would hide it. The legs differ only in WHICH bd
      # gets installed — pact has no tested-version gate to assert against any
      # more, because it has no runtime dependency to gate. Reading a real export
      # written by a newer bd is the thing under test.
      fail-fast: false
      matrix:
        leg: [pinned, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip — pins the ACTION, not the toolchain; Rust stays current because the action installs whatever stable is at run time

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Resolve the bd version for this leg
        id: bd
        env:
          LEG: ${{ matrix.leg }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tested range comes out of src/beads.rs. Restating it here would
          # create a second copy that drifts from the code it describes, which
          # is the exact failure this canary exists to catch.
          # No `| head -1`: under pipefail, head exits first, sed takes SIGPIPE
          # and the step dies with 141 and no output. That is exactly how the
          # canary script failed its first two runs; this copy has only ever
          # won the race.
          triplet() {
            local out
            out="$(sed -nE "s/^const $1: \(u64, u64, u64\) = \(([0-9]+), ([0-9]+), ([0-9]+)\);/\1.\2.\3/p" src/beads.rs)"
            printf '%s' "${out%%$'\n'*}"
          }
          MIN="$(triplet TESTED_BD_MIN)"
          MAX="$(triplet TESTED_BD_MAX_EXCLUSIVE)"
          if [ -z "$MIN" ] || [ -z "$MAX" ]; then
            echo "::error::could not read TESTED_BD_MIN/MAX out of src/beads.rs — has the declaration changed shape?"
            exit 1
          fi
          echo "tested range: $MIN <= v < $MAX"

          # Stable releases only: a pre-release is not what a user installs.
          gh release list --repo gastownhall/beads --limit 100 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease | not) | .tagName' \
            | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V > versions.txt

          if [ "$LEG" = latest ]; then
            VERSION="$(tail -1 versions.txt)"
          else
            # Newest release that is >= MIN and < MAX. sort -V does the ordering
            # so there is no arithmetic on version components here.
            VERSION="$(awk -v min="$MIN" -v max="$MAX" '
              function cmp(a, b,   x, y, i) {
                split(a, x, "."); split(b, y, ".")
                for (i = 1; i <= 3; i++) { if (x[i] + 0 != y[i] + 0) return (x[i] + 0 < y[i] + 0) ? -1 : 1 }
                return 0
              }
              cmp($0, min) >= 0 && cmp($0, max) < 0
            ' versions.txt | tail -1)"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::no stable bd release found for leg=$LEG (range $MIN..$MAX). Releases seen:"
            cat versions.txt
            exit 1
          fi
          echo "leg=$LEG resolved to bd $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install bd ${{ steps.bd.outputs.version }}
        env:
          VERSION: ${{ steps.bd.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release tarballs, named beads_<version>_linux_amd64.tar.gz. Verified
          # against the real asset list rather than assumed; `go install` and a
          # brew tap were not used because a tarball pins an exact version,
          # which the two-leg split depends on.
          gh release download "v${VERSION}" --repo gastownhall/beads \
            --pattern "beads_${VERSION}_linux_amd64.tar.gz" --output bd.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf bd.tar.gz -C "$HOME/.local/bin" bd
          chmod +x "$HOME/.local/bin/bd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirm bd runs
        run: |
          set -euo pipefail
          bd --version
          # bd 1.1.x embeds Dolt ("no external server needed" per `bd init
          # --help`) and needs no separate install. If a future bd changes that,
          # `bd init` inside the canary fails with its own message, which is a
          # clearer signal than a Dolt install we cannot justify today.
          command -v dolt >/dev/null && dolt version || echo "no external dolt — expected, bd embeds it"

      - name: Run the canary
        env:
          CANARY_LEG: ${{ matrix.leg }}
        run: scripts/canary.sh
