name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip — pins the ACTION, not the toolchain; Rust stays current because the action installs whatever stable is at run time
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Clippy (ui feature)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --features ui -- -D warnings
      - name: Test (ui feature)
        if: runner.os == 'Linux'
        run: cargo test --features ui
      # `otel` is off by default, so nothing above compiles a line of it. The
      # `ui` feature went unbuilt for exactly this reason until it got a job of
      # its own; this is that job, added on the day the feature landed instead.
      - name: Clippy (ui + otel features)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --features ui,otel -- -D warnings
      - name: Test (ui + otel features)
        if: runner.os == 'Linux'
        run: cargo test --features ui,otel
      # `mcp` is off by default for the same reason and rots the same way. Its
      # own leg rather than a slot in `ui,otel` because the default build is the
      # one that must NOT have the subcommand, and tests/mcp_absent.rs asserts
      # that from the other side — a single all-features leg would compile both
      # halves of that pair and run neither against the build it describes.
      - name: Clippy (mcp feature)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --features mcp -- -D warnings
      - name: Test (mcp feature)
        if: runner.os == 'Linux'
        run: cargo test --features mcp
      # mcp+otel together: the server's one span is `#[cfg]`-gated on otel, so
      # this is the only combination that compiles `otel::span` inside mcp.rs.
      - name: Clippy (mcp + otel features)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --features mcp,otel -- -D warnings
      - name: Test (mcp + otel features)
        if: runner.os == 'Linux'
        run: cargo test --features mcp,otel
      # The promise that decided the transport: the exporter is hand-rolled
      # OTLP/HTTP+JSON over std::net precisely because every opentelemetry-otlp
      # combination pulls tonic and tokio into a synchronous CLI. Enforced here
      # rather than remembered — the trees must be character-for-character equal.
      #
      # normal,build,dev, not normal: `--edges normal` prints neither
      # [build-dependencies] nor [dev-dependencies], so the guard let a build-dep
      # or dev-dep added by the feature through without a word. pact already has
      # a build-dependency (chrono, via build.rs).
      #
      # Every opt-in feature is checked, not just otel: `mcp` makes the same
      # promise for the same reason (MCP is newline-delimited JSON-RPC, so it is
      # serde_json plus std::io, and an SDK would charge an async runtime for
      # framing worth fifty lines). A guard that named one feature would have
      # gone quietly out of date the moment a second one arrived.
      - name: The opt-in features cost no dependency
        if: runner.os == 'Linux'
        run: |
          base="$(cargo tree --edges normal,build,dev)"
          for f in otel mcp mcp,otel; do
            test "$base" = "$(cargo tree --edges normal,build,dev --features "$f")" \
              || { echo "the $f feature(s) changed the dependency tree:"; \
                   cargo tree --edges normal,build,dev --features "$f"; exit 1; }
          done
      # Linux-only: the check walks `pact --help`, which is platform-independent,
      # and it needs the ui feature built — which only this job does. It shells
      # out to `pact doctor`, so it must run after checkout in a real git repo;
      # no `bd` is needed, the check names come back either way.
      - name: Docs match the CLI
        if: runner.os == 'Linux'
        run: ./scripts/check-docs.sh

  # Conventional-commit lint, PRs only.
  #
  # `cog bump` generates the changelog from commit subjects and silently drops
  # anything it cannot parse into a type it knows: a commit landed as
  # "chora: Add canary", cog did not recognise `chora`, and the release notes
  # simply never mentioned the canary. No error, no warning — the changelog was
  # just quietly incomplete. Catching it on the PR costs seconds; catching it
  # after a tag means rewriting history.
  #
  # PR-only on purpose. Running it on push would fail the branch for history
  # that is already immutable, which teaches people to ignore it.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # cog needs the real history to walk a range, not a shallow tip.
          fetch-depth: 0
      - uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          check: false
          check-latest-tag-only: false
      # Only the commits this PR adds. Checking all history would fail on
      # pre-existing subjects nobody can fix now, and merge commits come from
      # GitHub's own template rather than from an author.
      - name: cog check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: cog check --ignore-merge-commits "${BASE}..HEAD"
