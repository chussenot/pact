# Loaded on top of mise.toml when MISE_ENV=cloud, which .claude/hooks/session-start.sh
# sets for a Claude Code cloud session (docs/development.md, "Cloud sessions").
#
# The sandbox answers 403 on api.github.com for every repository but this one, so
# the backends mise.toml names cannot list versions, and mise's rust core cannot
# resolve a channel. Direct release downloads work, so the same tools, at the same
# versions, come from pinned release URLs. Rust stays rustup's, at the stable that
# CI uses. Keep the versions in step with mise.toml.
#
# Each URL also carries its sha256, which mise checks before it installs: a release
# asset can be replaced under an unchanged URL. bd's matches the checksums.txt its
# release publishes; cocogitto and shellcheck publish none, so theirs were recorded
# from the asset when the version was pinned.
[settings]
disable_tools = ["rust", "github:gastownhall/beads", "cargo:cocogitto", "shellcheck"]

[tools]
"http:bd" = { version = "1.2.2", url = "https://github.com/gastownhall/beads/releases/download/v1.2.2/beads_1.2.2_linux_amd64.tar.gz", checksum = "sha256:8140098a51d3b81d5548d1c5e6db1a2d9930e5d141efe2a4bff7d079c4d321e8" }
"http:cog" = { version = "7.0.0", url = "https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz", checksum = "sha256:e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb" }
"http:shellcheck" = { version = "0.11.0", url = "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz", checksum = "sha256:8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198" }
