[package]
name = "pact"
version = "0.1.0"
edition = "2021"

[features]
ui = ["dep:ratatui"]

[build-dependencies]
chrono = "0.4.45"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
ratatui = { version = "0.30.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[dev-dependencies]
tempfile = "3.27.0"
