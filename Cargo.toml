[package]
name = "pact"
version = "0.10.2"
edition = "2021"

[features]
ui = ["dep:ratatui"]
# OpenTelemetry export (pact-aw7). Deliberately adds NO dependency: the
# exporter is hand-written OTLP/HTTP+JSON over std::net on top of serde_json,
# which pact already has. See src/otel.rs for the measurements that rejected
# opentelemetry-otlp — every feature combination of it drags in tonic and
# tokio, and its flush-on-exit cost 1031 ms against a blackholed collector.
otel = []
# Read-only MCP server (`pact mcp serve`). Adds NO dependency for the same
# reason `otel` does not: MCP is JSON-RPC 2.0 over newline-delimited stdio, so
# it is serde_json — which pact already has — plus std::io. An SDK would buy
# framing pact can write in fifty lines and charge an async runtime for it.
#
# Off by default because the *cost* of the feature is not the code, it is the
# promise: a build with `mcp` in it can be spawned by anything that can spawn a
# subprocess. See src/mcp.rs for why that surface is read-only and stays so.
mcp = []

[build-dependencies]
chrono = "0.4.45"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
# `pact completion <shell>`. The one dependency added for a feature rather than
# avoided: it pulls in NO transitive crates (it sits on the clap already here),
# and it generates from the same command tree clap parses with, so a completion
# script cannot drift from the binary. The alternative is five hand-written
# scripts covering 24 commands and 23 long flags, which go stale the moment one
# is added — the exact failure `scripts/check-docs.sh` exists to catch for the
# docs. Costs ~220 KiB in the release binary; measured, not guessed.
clap_complete = "4.6.9"
ratatui = { version = "0.30.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[dev-dependencies]
tempfile = "3.27.0"
# Benchmarks only, and dev-only by construction: nothing in `[dependencies]`
# changes, so the shipped binary is byte-identical with or without this. Default
# features are OFF to keep the dev tree small — the html/plotters reporting is
# what drags the bulk of criterion's transitive graph in, and the budget check in
# CI reads `estimates.json`, which the base crate writes regardless.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# `harness = false` because criterion supplies its own main(). See
# benches/lease.rs's header for why the bench reaches pact's modules via
# `#[path]` includes instead of a new `[lib]` target.
[[bench]]
name = "lease"
harness = false
